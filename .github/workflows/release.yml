# Publishes release/Replayr.exe as a GitHub release whenever it changes on main.
# The version comes from CS_APP_VERSION in src/AppInfo.h; an existing tag is left alone.
name: Publish release
on:
  push:
    branches: [main]
    paths: [release/Replayr.exe]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -oP 'CS_APP_VERSION\s+"\K[^"]+' src/AppInfo.h)
          if gh release view "v$v" >/dev/null 2>&1; then echo "v$v already released"; exit 0; fi
          notes="$(cat release/NOTES.md 2>/dev/null || echo "Replayr v$v")"
          gh release create "v$v" release/Replayr.exe --title "Replayr v$v" --notes "$notes"
