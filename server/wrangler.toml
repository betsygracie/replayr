# Replayr account server: Cloudflare Workers + D1 + R2 (all on the free plan).
# See server/README.md for the one-time setup.
name = "replayr"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "replayr"
database_id = "6bc317e0-391f-4238-9254-972812c060cf"

# Cloud clip uploads (optional). R2 is free up to 10 GB but Cloudflare asks for a card to enable it,
# so it's off by default. To turn it on: create the bucket, then uncomment these three lines.
# [[r2_buckets]]
# binding = "CLIPS"
# bucket_name = "replayr-clips"

[vars]
# Shown on share pages. Change if you use your own domain.
APP_NAME = "Replayr"
MAX_UPLOAD_MB = "95"          # the free plan accepts request bodies up to 100 MB

# Secrets (set as GitHub repository secrets; the deploy workflow uploads them):
#   TOKEN_SECRET   any long random string (signs access tokens)
#   ADMIN_KEY      your private key for the invite-code page at /admin (16+ characters)
